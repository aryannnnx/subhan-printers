    <style>
        :root {
            --bg: #0d0d14;
            --surface: #13131f;
            --surface2: #1a1a2e;
            --primary: #8b5cf6;
            --primary2: #6d28d9;
            --gold: #f59e0b;
            --text: #e8e8f0;
            --muted: #8888aa;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
            position: relative;
        }

        /* ==========================================
   ANIMATED BACKGROUND BLOBS
   ========================================== */
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: .18;
            z-index: 0;
            pointer-events: none;
            will-change: transform;
            animation: blobFloat 20s ease-in-out infinite alternate;
        }

        .bg-blob.purple {
            width: 500px;
            height: 500px;
            background: rgba(139, 92, 246, .4);
            top: -150px;
            left: -150px;
        }

        .bg-blob.gold {
            width: 450px;
            height: 450px;
            background: rgba(245, 158, 11, .25);
            bottom: -150px;
            right: -150px;
            animation-delay: -10s;
        }

        @keyframes blobFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(30px, -30px) scale(1.1);
            }
        }

        /* ==========================================
   HEADER
   ========================================== */
        .header-home {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 12px 0;
            background: rgba(13, 13, 20, .85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, .06);
            transition: all .4s cubic-bezier(.4, 0, .2, 1);
        }

        .header-home.scrolled {
            padding: 8px 0;
            background: rgba(13, 13, 20, .95);
            box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
            padding: 8px 16px;
            transition: all .3s ease;
        }

        

        .nav-logo img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            transition: transform .3s ease;
        }

        .nav-logo:hover img {
            transform: rotate(10deg) scale(1.1);
        }

        .nav-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 800;
        }

        .nav-brand .brand-first {
            color: white;
        }

        .nav-brand .brand-second {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 5px;
            list-style: none;
        }

        .nav-links>li {
            position: relative;
        }

        .nav-links>li>a {
            color: var(--text);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 10px 18px;
            border-radius: 8px;
            position: relative;
            transition: all .3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-links>li>a::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 20px;
            height: 2px;
            background: var(--primary);
            border-radius: 2px;
            transition: transform .3s ease;
        }

        .nav-links>li>a:hover::after,
        .nav-links>li>a.active::after {
            transform: translateX(-50%) scaleX(1);
        }

        .nav-links>li>a:hover {
            color: white;
        }

        .nav-links>li>a.active {
            color: white;
        }

        .dropdown-toggle .dropdown-icon {
            font-size: 12px;
            transition: transform .3s ease;
        }

        .dropdown-toggle:hover .dropdown-icon {
            transform: rotate(180deg);
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            min-width: 240px;
            background: rgba(19, 19, 31, .98);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 14px;
            padding: 10px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all .3s cubic-bezier(.4, 0, .2, 1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, .4);
            list-style: none;
        }

        .dropdown-menu::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 30px;
            width: 12px;
            height: 12px;
            background: rgba(19, 19, 31, .98);
            border-left: 1px solid rgba(255, 255, 255, .08);
            border-top: 1px solid rgba(255, 255, 255, .08);
            transform: rotate(45deg);
        }

        .nav-links>li:hover .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-menu li a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border-radius: 10px;
            transition: all .3s ease;
        }

        .dropdown-menu li a:hover {
            background: rgba(139, 92, 246, .1);
            color: white;
            padding-left: 20px;
        }

        .dropdown-menu li a i {
            width: 20px;
            text-align: center;
            color: var(--primary);
            font-size: 14px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-login {
            padding: 10px 24px;
            background: #6d28d9;
            color: white;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            border-radius: 50px;
            cursor: pointer;
            transition: all .3s ease;
            text-decoration: none;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(124, 13, 222, .6);
        }

        .btn-order {
            padding: 10px 24px;
            background: linear-gradient(135deg, var(--gold), #d97706);
            border: none;
            color: white;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all .3s ease;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(245, 158, 11, .4);
        }

        .btn-order:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 158, 11, .6);
        }

        .hamburger-menu {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 8px;
            z-index: 1001;
        }

        .hamburger-menu span {
            width: 28px;
            height: 3px;
            background: white;
            border-radius: 3px;
            transition: all .3s ease;
            transform-origin: center;
        }

        .hamburger-menu.active span:nth-child(1) {
            transform: rotate(45deg) translate(6px, 6px);
        }

        .hamburger-menu.active span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }

        .hamburger-menu.active span:nth-child(3) {
            transform: rotate(-45deg) translate(6px, -6px);
        }

        .mobile-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: min(320px, 80vw);
            height: 100vh;
            background: rgba(19, 19, 31, .98);
            backdrop-filter: blur(20px);
            z-index: 999;
            padding: 100px 30px 30px;
            transition: right .4s cubic-bezier(.4, 0, .2, 1);
            border-left: 1px solid rgba(255, 255, 255, .08);
            overflow-y: auto;
        }

        .mobile-menu.active {
            right: 0;
        }

        .mobile-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text);
            text-decoration: none;
            padding: 16px 0;
            font-size: 16px;
            font-weight: 500;
            border-bottom: 1px solid rgba(255, 255, 255, .05);
            transition: color .3s ease, padding-left .3s ease;
        }

        .mobile-menu a:hover {
            color: var(--primary);
            padding-left: 10px;
        }

        .mobile-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            backdrop-filter: blur(4px);
            z-index: 998;
            opacity: 0;
            visibility: hidden;
            transition: all .3s ease;
        }

        .mobile-overlay.active {
            opacity: 1;
            visibility: visible;
        }
    </style>
